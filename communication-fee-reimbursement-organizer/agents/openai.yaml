interface:
  display_name: "通讯费报销整理"
  short_description: "按模板和级别顺序整理通讯费报销并合并发票 PDF"
  default_prompt: "Use $communication-fee-reimbursement-organizer to prepare a phone-fee reimbursement file from the policy, roster, address books, invoices, and template. Preserve the template formatting exactly, fill the level column from explicit person grade, award title such as 2025年优秀班组长, or position name when no grade exists, sort reimbursement-detail people by personnel level from high to low before assigning serial numbers, recalculate reimbursed amounts so over-cap invoice amounts are excluded, and when invoice files are available, merge each department's invoices into PDFs ordered by the reimbursement detail table."
